name: CNSL CI/CD

on:
  push:
    branches: [main]
    tags:     ['v*']
  pull_request:
    branches: [main]

jobs:

  #  Test 
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyotp bcrypt aiosqlite asyncpg pytest-timeout pytest-cov
          python -c "import tomllib" 2>/dev/null || pip install tomli

      - name: Run tests
        run: pytest tests/ -v --timeout=60 --cov=cnsl --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: Check version consistency
        run: |
          INIT_VER=$(python -c "from cnsl import __version__; print(__version__)")
          TOML_VER=$(python -c "import sys; sys.path.insert(0,''); m=__import__('tomllib' if sys.version_info>=(3,11) else 'tomli'); d=m.load(open('pyproject.toml','rb')); print(d['project']['version'])")
          ENGINE_VER=$(python -c "import re; print(re.search(r'version=\"CNSL (.+?)\"', open('cnsl/engine.py').read()).group(1))")
          CHART_VER=$(python -c "import yaml; print(yaml.safe_load(open('helm/cnsl/Chart.yaml'))['appVersion'])")
          echo "__init__: $INIT_VER  pyproject.toml: $TOML_VER  engine.py: $ENGINE_VER  Chart.yaml: $CHART_VER"
          [ "$INIT_VER" = "$TOML_VER" ] && [ "$INIT_VER" = "$ENGINE_VER" ] && [ "$INIT_VER" = "$CHART_VER" ] || (echo "VERSION MISMATCH!" && exit 1)

  #  Lint 
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install linters
        run: pip install pyflakes
      - name: Syntax check all modules
        run: |
          for f in cnsl/*.py; do
            python -m py_compile "$f" && echo "OK: $f"
          done
      - name: Pyflakes (warnings only)
        run: python -m pyflakes cnsl/ || true

  #  Helm chart 
  helm-lint:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: helm lint
        run: helm lint helm/cnsl

      - name: helm template (default values -- daemonset mode)
        run: helm template test-release helm/cnsl > /tmp/rendered-daemonset.yaml

      - name: helm template (deployment mode + redis enabled)
        run: |
          helm template test-release helm/cnsl \
            --set deploymentMode=deployment \
            --set redis.enabled=true \
            --set persistence.hostPath="" \
            > /tmp/rendered-deployment.yaml

      - name: Validate rendered manifests are well-formed YAML
        run: |
          pip install pyyaml
          python3 -c "
          import yaml
          for f in ['/tmp/rendered-daemonset.yaml', '/tmp/rendered-deployment.yaml']:
              docs = list(yaml.safe_load_all(open(f)))
              print(f'{f}: {len(docs)} document(s) parsed OK')
          "

  #  PyPI Release 
  publish:
    name: Publish to PyPI
    needs: [test, lint, helm-lint]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build distribution
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  #  GitHub Release 
  github-release:
    name: Create GitHub Release
    needs: [test, lint, helm-lint]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build distribution
        run: python -m build

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract changelog entry
        id: changelog
        run: |
          python3 << 'PYEOF'
          import re, os
          tag = os.environ.get('GITHUB_REF', '').replace('refs/tags/', '')
          content = open('docs/changelog.md').read()
          pattern = rf'(### {re.escape(tag)}.*?)(?=\n### v|\Z)'
          m = re.search(pattern, content, re.DOTALL)
          notes = m.group(1).strip() if m else f'Release {tag}'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'NOTES<<EOF\n{notes}\nEOF\n')
          PYEOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "CNSL ${{ steps.version.outputs.VERSION }}"
          body: ${{ steps.changelog.outputs.NOTES }}
          files: dist/*
          draft: false
          prerelease: false

  #  Docker 
  docker:
    name: Build & Push Docker image
    needs: [test, lint, helm-lint]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: meta
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAGS=ghcr.io/${{ github.repository_owner }}/cnsl:$VERSION,ghcr.io/${{ github.repository_owner }}/cnsl:latest" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.VERSION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}