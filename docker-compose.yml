version: "3.9"

# CNSL v3.4.14 -- Full stack
#
# Services:
#   cnsl        — Main detection engine + dashboard (port 8765)
#   redis       — Distributed blocklist sync (optional)
#   kafka       — High-volume log ingestion (optional)
#   zookeeper   — Required by Kafka
#   filebeat    — Ships auth.log to Kafka (optional, needs config)
#
# Quickstart (CNSL + Redis only):
#   docker compose --profile core up -d
#
# Full stack (with Kafka):
#   docker compose --profile core --profile kafka up -d
#
# View logs:
#   docker compose logs -f cnsl
#
# Stop:
#   docker compose down

services:

  #  CNSL main 

  cnsl:
    build: .
    image: cnsl:3.4.14
    container_name: cnsl
    profiles: ["core"]
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host          # needed for iptables + tcpdump
    volumes:
      - /var/log:/var/log:ro
      - ./config/config.json:/etc/cnsl/config.json:ro
      - cnsl_data:/var/lib/cnsl
      - cnsl_logs:/var/log/cnsl
    environment:
      - PYTHONUNBUFFERED=1
    command:
      - --config
      - /etc/cnsl/config.json
      - --dashboard
      - --execute
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8765/api/health"]
      interval: 30s
      timeout:  5s
      retries:  3
    depends_on:
      redis:
        condition: service_healthy
        required: false
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  #  CNSL agent (example remote log forwarder) 

  cnsl-agent:
    build: .
    image: cnsl:3.4.14
    container_name: cnsl-agent
    profiles: ["agent"]
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - ./config/agent.json:/etc/cnsl/agent.json:ro
    entrypoint: ["python", "-m", "cnsl.agent"]
    command:
      - --config
      - /etc/cnsl/agent.json
    depends_on:
      - cnsl
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  #  Redis (distributed blocklist) 

  redis:
    image: redis:7-alpine
    container_name: cnsl-redis
    profiles: ["core"]
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  3s
      retries:  5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  #  Zookeeper (required by Kafka) 

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: cnsl-zookeeper
    profiles: ["kafka"]
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
    ports:
      - "127.0.0.1:2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout:  5s
      retries:  5
    logging:
      driver: json-file
      options:
        max-size: "20m"

  #  Kafka 

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cnsl-kafka
    profiles: ["kafka"]
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID:                     1
      KAFKA_ZOOKEEPER_CONNECT:             zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS:          PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:    INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:     "true"
      KAFKA_LOG_RETENTION_HOURS:           24
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout:  10s
      retries:  5
    logging:
      driver: json-file
      options:
        max-size: "50m"

  #  Kafka topic init 

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cnsl-kafka-init
    profiles: ["kafka"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic auth_logs   --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic nginx_logs  --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic syslog      --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic cnsl_events --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic zeek_ssh    --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic zeek_http   --partitions 3 --replication-factor 1
      echo 'Kafka topics created.'
      "

  #  Filebeat (ships auth.log to Kafka) 

  filebeat:
    image: elastic/filebeat:8.11.0
    container_name: cnsl-filebeat
    profiles: ["kafka"]
    restart: unless-stopped
    user: root
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - /var/log:/var/log:ro
      - ./config/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
    command: filebeat -e -strict.perms=false
    logging:
      driver: json-file
      options:
        max-size: "10m"

volumes:
  cnsl_data:
  cnsl_logs:
  redis_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data: