# Filebeat config — ships auth.log and nginx logs to Kafka
# Used by docker-compose --profile kafka

filebeat.inputs:
  - type: log
    id: auth-log
    enabled: true
    paths:
      - /var/log/auth.log
      - /var/log/secure
    tags: ["auth"]
    fields:
      topic: auth_logs
    fields_under_root: false

  - type: log
    id: nginx-log
    enabled: true
    paths:
      - /var/log/nginx/access.log
    tags: ["nginx"]
    fields:
      topic: nginx_logs
    fields_under_root: false

  - type: log
    id: syslog
    enabled: true
    paths:
      - /var/log/syslog
      - /var/log/messages
    tags: ["syslog"]
    fields:
      topic: syslog
    fields_under_root: false

output.kafka:
  hosts: ["kafka:29092"]
  topic: '%{[fields.topic]}'
  codec.format:
    string: '%{[message]}'
  required_acks: 1
  compression: gzip
  max_message_bytes: 1000000

logging.level: warning